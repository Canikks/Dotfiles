# ─────────────────────────────────────────────────────────────
# Jetpack-inspired Starship prompt
# Optimized for Ghostty + MesloLGS Nerd Font
# ─────────────────────────────────────────────────────────────

add_newline = true
palette = "nix"

format = """
$os$username $directory $git_branch$git_status $nix_shell $cmd_duration
$character
"""

# ───── Palette ─────
[palettes.nix]
bg = "#1e1e2e"
fg = "#cdd6f4"
blue = "#89b4fa"
cyan = "#74c7ec"
green = "#a6e3a1"
yellow = "#f9e2af"
red = "#f38ba8"
gray = "#6c7086"

# ───── OS (NixOS) ─────
[os]
disabled = false
style = "bg:blue fg:bg"
format = "[$symbol]($style)"

[os.symbols]
NixOS = "󱄅"

# ───── User ─────
[username]
show_always = true
style_user = "bg:blue fg:bg"
style_root = "bg:red fg:bg"
format = "[ $user ]($style)"

# ───── Directory ─────
[directory]
style = "bg:cyan fg:bg"
format = "[   $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# ───── Git ─────
[git_branch]
symbol = "󰘬 "
style = "bg:green fg:bg"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:green fg:bg"
format = "[ $all_status$ahead_behind ]($style)"
conflicted = "⚠ "
modified = "✚ "
staged = "● "
renamed = "» "
untracked = "… "
ahead = "⇡"
behind = "⇣"
diverged = "⇕"

# ───── Nix ─────
[nix_shell]
symbol = "󱄅 "
style = "bg:yellow fg:bg"
format = "[ $symbol$name ]($style)"

# ───── Cmd duration ─────
[cmd_duration]
min_time = 500
style = "bg:gray fg:fg"
format = "[ 󱫐 $duration ]($style)"

# ───── Prompt char ─────
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
