# ─────────────────────────────────────────
# JATPACK-INSPIRED STARSHIP PROMPT
# Ghostty + MesloLGS Nerd Font
# ─────────────────────────────────────────

format = """
$os$username$hostname \
$directory \
$git_branch$git_status \
$nix_shell$nodejs$python$rust$golang \
$cmd_duration \
$time
$character
"""

add_newline = true

# ───── Core blocks ─────

[os]
disabled = false
style = "bg:blue fg:black"
format = "[$symbol ]($style)"

[os.symbols]
NixOS = "󱄅"

[username]
show_always = true
style_user = "bg:blue fg:black"
style_root = "bg:red fg:black"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bg:blue fg:black"
format = "[@$hostname]($style)"

[directory]
style = "bg:cyan fg:black"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# ───── Git ─────

[git_branch]
symbol = ""
style = "bg:purple fg:black"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:purple fg:black"
format = "[$all_status$ahead_behind ]($style)"

# ───── Languages / Environments ─────

[nix_shell]
symbol = ""
style = "bg:blue fg:black"
format = "[ $symbol nix ]($style)"

[nodejs]
symbol = ""
style = "bg:green fg:black"
format = "[ $symbol $version ]($style)"

[python]
symbol = ""
style = "bg:yellow fg:black"
format = "[ $symbol $version ]($style)"

[rust]
symbol = ""
style = "bg:red fg:black"
format = "[ $symbol $version ]($style)"

[golang]
symbol = ""
style = "bg:cyan fg:black"
format = "[ $symbol $version ]($style)"

# ───── Meta ─────

[cmd_duration]
style = "bg:bright-black fg:white"
format = "[ 󱫐 $duration ]($style)"

[time]
disabled = false
style = "bg:bright-black fg:white"
format = "[ 󰥔 $time ]($style)"
time_format = "%H:%M"

# ───── Prompt char ─────

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
